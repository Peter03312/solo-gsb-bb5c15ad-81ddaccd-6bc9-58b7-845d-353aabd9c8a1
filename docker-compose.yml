services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timing
      POSTGRES_PASSWORD: timing
      POSTGRES_DB: timing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing -d timing"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://timing:timing@db:5432/timing
      DB_CONNECT_RETRIES: "30"
      DB_CONNECT_RETRY_DELAY_SECONDS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
